# nginx для PULSE: статику отдаёт сам, в Node уходят только запросы к API.
# Схема рассчитана на сервер 1 vCPU / 768 МБ: nginx держит десятки МБ RSS,
# а процесс игры остаётся маленьким.

server {
    listen 80;
    listen [::]:80;
    server_name pulse.example.com;

    root /var/www/pulse;
    index index.html;

    # Логи с ротацией: файлы не должны расти бесконечно.
    access_log /var/log/nginx/pulse-access.log;
    error_log  /var/log/nginx/pulse-error.log warn;

    # Сжатие: статика состоит из текста, выигрыш заметный.
    gzip on;
    gzip_types text/html text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Статика с длинным кэшем: имена файлов меняются вместе с релизом.
    location ~* \.(css|js|svg|ico|png|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Разметка не кэшируется: ссылки на модули должны обновляться сразу.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API: только эти пути проксируются в Node.
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Запросы к API короткие: зависшее соединение не должно держать воркер.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Сервисные файлы не отдаём наружу.
    location ~ /\.(env|git|gitignore) {
        deny all;
    }
}

