# Настройки ядра под слабый сервер. Применяются через sysctl.
#
# Ставится в /etc/sysctl.d/99-pulse.conf, затем: sysctl --system
#
# Задача — чтобы один процесс Node и nginx уживались в 768 МБ и не упирались
# в лимиты сокетов при пиковой нагрузке (ежедневный челлендж в 00:00 UTC).

# Больше одновременных соединений: nginx держит keep-alive, Node принимает API.
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.ip_local_port_range = 10240 65000

# Быстрее освобождать закрытые соединения: короткие запросы к API.
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# Включать keep-alive раньше и держать его дольше — меньше рукопожатий.
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Не раздувать swap на слабом диске: лучше отдать страницы под кэш.
vm.swappiness = 10
